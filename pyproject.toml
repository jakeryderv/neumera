[project]
name = "neumera"
requires-python = ">=3.12,<3.15"
classifiers = [
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
]
dynamic = ["version"]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
