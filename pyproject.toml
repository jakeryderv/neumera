[project]
name = "neumera"
description = "Lean-checked mathematical guarantees carried through Rust and Python programs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jake Van Slyke" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
]
dependencies = [
  "numpy>=2.5.4",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jakeryderv/neumera"

[dependency-groups]
dev = [
  "maturin>=1.15,<2.0",
  "pytest>=9.1.1",
  "ruff>=0.17.3",
  "ty>=0.0.92",
  { include-group = "commit" },
]
# Commit message tooling; separate so CI can install it alone
commit = [
  "commitizen>=4.19.3",
]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "neumera._core"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Generated by `maturin develop --generate-stubs`; don't reformat
extend-exclude = ["src/neumera/_core.pyi", "docs", "*.md"]
