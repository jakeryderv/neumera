[project]
name = "neumera"
description = "Foundational implementations and utilities for machine learning, numerical computing, and optimization."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jake Van Slyke" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jakeryderv/neumera"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "neumera._core"

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Generated by `maturin develop --generate-stubs`; don't reformat
extend-exclude = ["src/neumera/_core.pyi"]
