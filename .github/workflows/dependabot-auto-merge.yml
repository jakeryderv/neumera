# Auto-merge Dependabot PRs for GitHub Actions (any update) and uv dev
# dependencies (minor/patch) once required checks pass. Cargo and Rust
# toolchain updates stay manual: pyo3 bumps can change the generated stubs.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge
        if: >-
          startsWith(github.head_ref, 'dependabot/github_actions/') ||
          (startsWith(github.head_ref, 'dependabot/uv/') && steps.meta.outputs.update-type != 'version-update:semver-major')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
