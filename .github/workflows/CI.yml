# Originally generated by maturin v1.15.0 (`maturin generate-ci github`),
# now maintained by hand. Regenerating it will drop the custom `check` job
# and re-add a release job; publishing lives in publish.yml.
#
# Platform policy: wheels are built only where Lean ships a prebuilt
# toolchain, since the extension links the Lean runtime. Lean's Tier 1 is
# x86-64 Linux (glibc 2.26+), aarch64 Linux (glibc 2.27+), Apple Silicon
# macOS, and x86-64 Windows; Intel macOS is Tier 2 (cross-compiled,
# untested upstream). The glibc floor rules out manylinux2014, so Linux
# wheels use manylinux_2_28. Intel macOS and Windows are best-effort until
# the Lean link is shown to work there.
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref, but never a tag (release) run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: py${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run checks
        run: just check
      - name: Check type stubs are up to date
        run: git diff --exit-code src/neumera/_core.pyi

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: 2_28
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.platform.best_effort }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
            best_effort: false
          - runner: macos-15-intel
            target: x86_64
            best_effort: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # Install the built wheels and run the test suite against them, natively on
  # each platform. Best-effort platforms may be missing their artifact.
  #
  # The wheel is installed with --no-index, so this job cannot resolve runtime
  # dependencies. The project has none by design. If one is ever added, install
  # it from the index first and then the wheel with --no-index --no-deps.
  test-wheels:
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.platform.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        platform:
          - runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
            best_effort: false
          - runner: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
            best_effort: false
          - runner: macos-latest
            artifact: wheels-macos-aarch64
            best_effort: false
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
            best_effort: true
          - runner: windows-latest
            artifact: wheels-windows-x64
            best_effort: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          no-project: true
      - name: Install wheel
        shell: bash
        run: |
          uv pip install pytest
          uv pip install --no-index --find-links dist neumera
          python -c "import neumera; print(neumera.__file__)"
      - name: Run tests
        run: python -m pytest

  # Single required status check that summarizes every job above
  ci-ok:
    if: always()
    needs: [check, linux, macos, windows, sdist, test-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
