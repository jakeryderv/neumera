[package]
name = "neumera-lean-sys"
description = "Raw FFI bindings for the Lean 4 C ABI, pinned to the repository's Lean toolchain. Vendored from lean-rs-sys; see VENDORED.md."
version.workspace = true
edition.workspace = true
# Vendored code keeps its upstream licence terms (MIT OR Apache-2.0); see LICENSE-MIT and LICENSE-APACHE here.
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false
links = "lean"

[features]
# `dynamic` links `libleanshared`. `static` emits upstream's archive list, which
# includes the compiler and Lake and does not currently link a binary on Linux
# (it names `stdc++` where the archives need `c++`); the lib target builds, test
# binaries do not. It is kept only as the starting point for the runtime-only
# static mode described in docs/static-linking-spike.md. Exactly one of the two
# must be enabled.
default = ["dynamic"]
dynamic = []
static = []

[dependencies]

[build-dependencies]
sha2.workspace = true

[lib]
doctest = false
