[package]
name = "neumera-lean-sys"
description = "Raw FFI bindings for the Lean 4 C ABI, pinned to the repository's Lean toolchain. Vendored from lean-rs-sys; see VENDORED.md."
version.workspace = true
edition.workspace = true
# Vendored code keeps its upstream licence terms (MIT OR Apache-2.0); see LICENSE-MIT and LICENSE-APACHE here.
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false
links = "lean"

[features]
# `dynamic` links `libleanshared` with an rpath into the toolchain (fast links,
# toolchain required at run time). `static` links the runtime archives (`leanrt`,
# `Init`, and the toolchain's `gmp`, `uv`, `c++`, `c++abi`) into this crate's
# rlib, so executables run without a toolchain; Linux only, and not linkable
# into a shared object as shipped (see docs/static-linking-spike.md). Exactly one
# of the two must be enabled.
default = ["dynamic"]
dynamic = []
static = []

[dependencies]

[build-dependencies]
sha2.workspace = true

[lib]
doctest = false
