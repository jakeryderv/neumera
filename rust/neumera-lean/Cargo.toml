[package]
name = "neumera-lean"
description = "Lean integration layer: calls compiled Lean code and preserves established properties on concrete data."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Name is provisional and the API is a first slice; not published until both settle.
publish = false
links = "neumera_Neumera"

[features]
# Link mode of the Lean runtime, forwarded to `neumera-lean-sys`: `dynamic`
# needs the toolchain at run time, `static` does not (Linux only so far).
default = ["dynamic"]
dynamic = ["neumera-lean-sys/dynamic"]
static = ["neumera-lean-sys/static"]

[dependencies]
neumera-lean-sys.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
