[package]
name = "neumera-py"
description = "Python adapter for neumera, built with PyO3 and maturin."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Built into the Python wheel by maturin; never published to crates.io.
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

# This crate does not yet depend on `neumera-lean`. Adding that dependency
# makes every wheel build run Lake and link the Lean runtime, which is the
# PyO3 integration slice, not this one.
[dependencies]
pyo3.workspace = true
